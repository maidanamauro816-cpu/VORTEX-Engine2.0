name: VORTEX Engine Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VORTEX Engine
        uses: actions/checkout@v4

      - name: Download Captord MIT source at a fixed revision
        run: |
          git clone https://github.com/Drenzzz/Captord.git upstream
          cd upstream
          git checkout 2052189c92cdc86c7fc421127f7429ccae493f72
          echo "CAPTORD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Rebrand app for VORTEX
        working-directory: upstream
        run: |
          sed -i 's/applicationId = "com.captord.screenrecorder"/applicationId = "com.vortex.engine"/' app/build.gradle.kts
          sed -i 's/versionName = "1.0"/versionName = "2.0.0"/' app/build.gradle.kts
          find app/src/main/res -name strings.xml -type f -exec sed -i 's/Captord/VORTEX Engine/g' {} +
          find app/src/main -type f \( -name '*.xml' -o -name '*.kt' \) -exec sed -i 's/Captord/VORTEX Engine/g' {} +
          cat > VORTEX-ATTRIBUTION.md <<'EOF'
          VORTEX Engine 2.0 includes software derived from Captord.
          Original project: https://github.com/Drenzzz/Captord
          Copyright (c) Captord contributors. Licensed under the MIT License.
          The original MIT license is included in this source tree as LICENSE.
          VORTEX branding and application changes are maintained separately.
          © 2026 Mauro Iván Maidana. All rights reserved for original VORTEX contributions.
          EOF

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@035682743ab223ec9c6169af09811dff8247e520
        with:
          cmdline-tools-version: 15859902
          packages: |
            platform-tools
            platforms;android-37
            build-tools;37.0.0

      - name: Build debug APK
        working-directory: upstream
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK and source attribution
        uses: actions/upload-artifact@v4
        with:
          name: VORTEX-Engine-2.0-debug
          path: |
            upstream/app/build/outputs/apk/debug/*.apk
            upstream/LICENSE
            upstream/VORTEX-ATTRIBUTION.md
          if-no-files-found: error
          retention-days: 14
